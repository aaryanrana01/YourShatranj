# Full production stack on one machine (e.g. an Oracle Cloud Always Free VM):
#   caddy  -> HTTPS certificates + reverse proxy (WebSockets included)
#   app    -> the chess server, which also serves the web app
#   db     -> PostgreSQL (permanent data)
#   redis  -> live games, matchmaking, rate limits
# Usage: cp .env.example .env, fill it in, then `docker compose up -d --build`.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://chess:${POSTGRES_PASSWORD}@db:5432/chess
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: https://${DOMAIN}
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports: only Caddy can reach the app.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_DB: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chess']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: live games survive a Redis restart too.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  caddydata:
